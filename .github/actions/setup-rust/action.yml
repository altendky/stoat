name: Setup Rust
description: Install Rust toolchain

inputs:
  toolchain:
    description: Rust toolchain version to install
    required: true
  components:
    description: Comma-separated list of components to install (e.g., "rustfmt, clippy")
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
